<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Изменение цвета текста</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="color-container">
            <h2>Изменение цвета текста</h2>
            <p id="colorText">Измени мой цвет!</p>
            <div class="select-wrapper">
                <select id="colorSelect">
                    <option value="" disabled selected>Выберите цвет</option>
                    <option value="#FF0000">Красный</option>
                    <option value="#00FF00">Зеленый</option>
                    <option value="#0000FF">Синий</option>
                    <option value="#FFFF00">Желтый</option>
                    <option value="#FF00FF">Пурпурный</option>
                    <option value="#00FFFF">Бирюзовый</option>
                    <option value="#000000">Черный</option>
                    <option value="#800080">Фиолетовый</option>
                </select>
            </div>
            <div class="selected-color">
                Выбранный цвет: <span id="currentColor">не выбран</span>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
