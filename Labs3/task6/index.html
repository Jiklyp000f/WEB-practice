<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Удаление элементов списка</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="list-container">
            <h2>Управление списком</h2>
            <ul id="itemList">
                <li>Первый пункт</li>
                <li>Второй пункт</li>
                <li>Третий пункт</li>
                <li>Четвертый пункт</li>
                <li>Пятый пункт</li>
            </ul>
            <div class="controls">
                <button id="removeLastButton">Удалить последний пункт</button>
                <div class="counter">Осталось пунктов: <span id="itemsCount">5</span></div>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
