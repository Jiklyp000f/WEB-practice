<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Управление видимостью элемента</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="visibility-container">
            <h2>Управление видимостью элемента</h2>
            <div id="toggleElement" class="visible-element">
                Этот элемент можно скрыть или показать
            </div>
            <button id="toggleButton">Переключить видимость</button>
            <div class="status">Статус: <span id="statusText">видимый</span></div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
