<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомные чекбоксы и радиокнопки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form class="custom-form">
            <fieldset class="form-section">
                <legend class="form-legend">Выберите интересы</legend>
                
                <div class="form-group">
                    <input type="checkbox" id="sports" name="interests" class="form-checkbox">
                    <label for="sports" class="form-label">
                        <span class="form-label-text">Спорт</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="checkbox" id="music" name="interests" class="form-checkbox">
                    <label for="music" class="form-label">
                        <span class="form-label-text">Музыка</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="checkbox" id="books" name="interests" class="form-checkbox">
                    <label for="books" class="form-label">
                        <span class="form-label-text">Книги</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="checkbox" id="travel" name="interests" class="form-checkbox">
                    <label for="travel" class="form-label">
                        <span class="form-label-text">Путешествия</span>
                    </label>
                </div>
            </fieldset>
            
            <fieldset class="form-section">
                <legend class="form-legend">Выберите возрастную категорию</legend>
                
                <div class="form-group">
                    <input type="radio" id="age1" name="age" class="form-radio">
                    <label for="age1" class="form-label">
                        <span class="form-label-text">До 18 лет</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="radio" id="age2" name="age" class="form-radio">
                    <label for="age2" class="form-label">
                        <span class="form-label-text">18-30 лет</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="radio" id="age3" name="age" class="form-radio">
                    <label for="age3" class="form-label">
                        <span class="form-label-text">31-50 лет</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="radio" id="age4" name="age" class="form-radio">
                    <label for="age4" class="form-label">
                        <span class="form-label-text">Старше 50 лет</span>
                    </label>
                </div>
            </fieldset>
            
            <fieldset class="form-section">
                <legend class="form-legend">Дополнительные опции</legend>
                
                <div class="form-group">
                    <input type="checkbox" id="newsletter" name="newsletter" class="form-checkbox" checked>
                    <label for="newsletter" class="form-label">
                        <span class="form-label-text">Получать новости на email</span>
                    </label>
                </div>
                
                <div class="form-group">
                    <input type="checkbox" id="disabled" name="disabled" class="form-checkbox" disabled>
                    <label for="disabled" class="form-label form-label--disabled">
                        <span class="form-label-text">Неактивный чекбокс</span>
                    </label>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
